# Fly.io deployment. See DEPLOY.md for the step-by-step.
#
# NOTE: the app loads torch + a MiniLM embedder + a cross-encoder, which need
# ~1.5GB RAM. The 256MB free VM will OOM — this config requests 2GB, which is a
# paid tier. Adjust `memory` down at your own risk.

app = "rag-eval-based"       # change to a globally-unique name: `fly apps create`
primary_region = "iad"       # pick one near you: fly platform regions

[build]
  dockerfile = "Dockerfile.deploy"

[env]
  VECTOR_BACKEND = "faiss"
  DEFAULT_PROVIDER = "gemini"
  # GEMINI_API_KEY is set via `fly secrets set`, NOT here (never commit keys).

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true      # scale to zero when idle → cheaper
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"                  # models need the headroom

[checks.health]
  type = "http"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"           # first boot loads models — give it time
