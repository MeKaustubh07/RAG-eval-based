# Local run: `docker compose up --build`
#
# The API container talks to an Ollama running on the HOST (installed via brew),
# reached through host.docker.internal. The built index is mounted in read-only
# so you rebuild it on the host (python scripts/build_index.py) and the
# container just serves it.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro   # index + chunks.json
      - ./data:/app/data                          # writable, for logs.jsonl
    environment:
      # OllamaProvider reads this if set; falls back to localhost otherwise.
      - OLLAMA_URL=http://host.docker.internal:11434
      # Flip to "qdrant" (and run index_qdrant.py) to use the vector DB.
      - VECTOR_BACKEND=${VECTOR_BACKEND:-faiss}
      - QDRANT_URL=http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"       # Linux needs this mapping
    depends_on:
      - qdrant

  # Real vector DB. Only used when VECTOR_BACKEND=qdrant; harmless otherwise.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
